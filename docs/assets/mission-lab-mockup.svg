<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Physics Teacher Interactive interactive mission lab</title>
  <desc id="desc">Mission player mockup showing an experiment viewport, controls, prediction prompt, and live measurements.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081019"/><stop offset="1" stop-color="#172342"/></linearGradient><linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/><rect x="28" y="24" width="1144" height="58" rx="18" fill="#ffffff0b" stroke="#ffffff1c"/><text x="60" y="60" fill="#fff" font-family="Inter,Arial" font-size="17" font-weight="700">Physics Teacher Interactive</text><text x="916" y="60" fill="#7ee7c5" font-family="Inter,Arial" font-size="12" font-weight="700">MISSION 03 / 07</text>
  <text x="58" y="136" fill="#67e8f9" font-family="Inter,Arial" font-size="11" font-weight="700" letter-spacing="2">OBSERVE • PREDICT • SIMULATE</text><text x="58" y="177" fill="#fff" font-family="Inter,Arial" font-size="35" font-weight="800">Projectile motion</text><text x="58" y="207" fill="#aab4c6" font-family="Inter,Arial" font-size="14">How does launch angle change the range of a projectile?</text>
  <rect x="58" y="242" width="700" height="350" rx="22" fill="#050912" stroke="#ffffff24"/><path d="M112 530h590M145 530v-210" stroke="#334155" stroke-width="2"/><path d="M150 500 C270 275 430 300 675 500" fill="none" stroke="url(#cyan)" stroke-width="5"/><circle cx="150" cy="500" r="12" fill="#67e8f9"/><circle cx="675" cy="500" r="12" fill="#a78bfa"/><text x="105" y="560" fill="#7f8da6" font-family="Inter,Arial" font-size="12">Interactive simulation viewport</text>
  <rect x="786" y="242" width="356" height="350" rx="22" fill="#ffffff0c" stroke="#ffffff24"/><text x="818" y="282" fill="#fff" font-family="Inter,Arial" font-size="17" font-weight="700">Experiment controls</text><text x="818" y="325" fill="#aab4c6" font-family="Inter,Arial" font-size="12">Launch angle</text><rect x="818" y="340" width="285" height="7" rx="4" fill="#ffffff18"/><rect x="818" y="340" width="182" height="7" rx="4" fill="url(#cyan)"/><text x="1068" y="326" fill="#67e8f9" font-family="Inter,Arial" font-size="12" font-weight="700">42°</text><text x="818" y="386" fill="#aab4c6" font-family="Inter,Arial" font-size="12">Initial speed</text><rect x="818" y="401" width="285" height="7" rx="4" fill="#ffffff18"/><rect x="818" y="401" width="218" height="7" rx="4" fill="url(#cyan)"/><text x="1060" y="387" fill="#67e8f9" font-family="Inter,Arial" font-size="12" font-weight="700">18 m/s</text><rect x="818" y="455" width="128" height="42" rx="12" fill="#67e8f9"/><text x="850" y="481" fill="#06121b" font-family="Inter,Arial" font-size="13" font-weight="800">Run test</text><rect x="960" y="455" width="143" height="42" rx="12" fill="#ffffff10" stroke="#ffffff24"/><text x="992" y="481" fill="#fff" font-family="Inter,Arial" font-size="13" font-weight="700">Reset</text><text x="818" y="548" fill="#7ee7c5" font-family="Inter,Arial" font-size="12" font-weight="700">LIVE MEASUREMENT</text><text x="818" y="572" fill="#fff" font-family="Inter,Arial" font-size="14">Range: 31.4 m</text>
  <rect x="58" y="624" width="1084" height="76" rx="18" fill="#ffffff0c" stroke="#ffffff1c"/><text x="88" y="657" fill="#fff" font-family="Inter,Arial" font-size="15" font-weight="700">Your prediction</text><text x="88" y="680" fill="#aab4c6" font-family="Inter,Arial" font-size="13">Make a claim, test it in the lab, then explain the evidence.</text><rect x="930" y="642" width="170" height="38" rx="11" fill="#a78bfa"/><text x="970" y="666" fill="#fff" font-family="Inter,Arial" font-size="12" font-weight="800">Continue lesson →</text>
</svg>
