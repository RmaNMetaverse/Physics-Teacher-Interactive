<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Physics Teacher Interactive progress dashboard</title>
  <desc id="desc">Dark liquid-glass progress dashboard with XP, streak, daily goal, course mastery, and activity cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#090d15"/><stop offset="1" stop-color="#17142c"/></linearGradient>
    <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <rect x="28" y="24" width="1144" height="58" rx="18" fill="#ffffff0b" stroke="#ffffff1c"/>
  <circle cx="62" cy="53" r="14" fill="url(#violet)"/><text x="88" y="50" fill="#fff" font-family="Inter,Arial" font-size="17" font-weight="700">Physics Teacher Interactive</text><text x="88" y="68" fill="#a4a8b8" font-family="Inter,Arial" font-size="10" letter-spacing="2">LEARN BY DOING</text>
  <text x="58" y="135" fill="#7ee7c5" font-family="Inter,Arial" font-size="11" font-weight="700" letter-spacing="2">YOUR LEARNING RECORD</text><text x="58" y="177" fill="#fff" font-family="Inter,Arial" font-size="38" font-weight="800">Progress</text>
  <g filter="url(#shadow)">
    <rect x="58" y="205" width="1084" height="116" rx="22" fill="#ffffff0c" stroke="#ffffff24"/>
    <text x="88" y="245" fill="#fff" font-family="Inter,Arial" font-size="17" font-weight="700">🏆 Level 4</text><text x="975" y="245" fill="#a78bfa" font-family="Inter,Arial" font-size="16" font-weight="700">1,240 XP</text><text x="88" y="274" fill="#a4a8b8" font-family="Inter,Arial" font-size="13">240 / 500 XP to next level</text><rect x="88" y="291" width="1024" height="10" rx="5" fill="#ffffff18"/><rect x="88" y="291" width="492" height="10" rx="5" fill="url(#violet)"/>
  </g>
  <g filter="url(#shadow)"><rect x="58" y="343" width="527" height="124" rx="22" fill="#ffffff0c" stroke="#ffffff24"/><rect x="615" y="343" width="527" height="124" rx="22" fill="#ffffff0c" stroke="#ffffff24"/></g>
  <text x="90" y="380" fill="#a4a8b8" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="1">DAILY STREAK</text><text x="90" y="420" fill="#fff" font-family="Inter,Arial" font-size="28" font-weight="800">12 days</text><text x="90" y="446" fill="#7ee7c5" font-family="Inter,Arial" font-size="13">Personal best: 18 days</text>
  <text x="647" y="380" fill="#a4a8b8" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="1">DAILY LEARNING GOAL</text><text x="647" y="411" fill="#fff" font-family="Inter,Arial" font-size="15" font-weight="700">Choose your mission target</text><rect x="647" y="427" width="132" height="25" rx="9" fill="#a78bfa24" stroke="#a78bfa"/><text x="677" y="444" fill="#cfc4ff" font-family="Inter,Arial" font-size="11" font-weight="700">3 missions / day</text>
  <g filter="url(#shadow)"><rect x="58" y="493" width="1084" height="224" rx="22" fill="#ffffff0c" stroke="#ffffff24"/></g><text x="90" y="535" fill="#fff" font-family="Inter,Arial" font-size="20" font-weight="800">Course Mastery</text><text x="978" y="535" fill="#a4a8b8" font-family="Inter,Arial" font-size="12">24 missions completed</text>
  <g fill="#171c2a" stroke="#ffffff18"><rect x="90" y="563" width="235" height="118" rx="16"/><rect x="345" y="563" width="235" height="118" rx="16"/><rect x="600" y="563" width="235" height="118" rx="16"/><rect x="855" y="563" width="235" height="118" rx="16"/></g>
  <g fill="none" stroke="#ffffff20" stroke-width="9"><circle cx="145" cy="615" r="27"/><circle cx="400" cy="615" r="27"/><circle cx="655" cy="615" r="27"/><circle cx="910" cy="615" r="27"/></g><g fill="none" stroke="#a78bfa" stroke-width="9" stroke-linecap="round"><path d="M145 588a27 27 0 0 1 24 40"/><path d="M400 588a27 27 0 0 1 17 48"/><path d="M655 588a27 27 0 0 1 9 53"/><path d="M910 588a27 27 0 0 1 5 54"/></g>
  <g fill="#fff" font-family="Inter,Arial" font-size="12" font-weight="700"><text x="188" y="609">Kinematics</text><text x="443" y="609">Forces</text><text x="698" y="609">Energy</text><text x="953" y="609">Waves</text></g><g fill="#a4a8b8" font-family="Inter,Arial" font-size="11"><text x="188" y="630">72% complete</text><text x="443" y="630">58% complete</text><text x="698" y="630">41% complete</text><text x="953" y="630">24% complete</text></g>
